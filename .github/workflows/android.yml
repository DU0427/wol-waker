name: build-android-apk

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # ubuntu-latest 镜像自带 Android SDK（见 runner-images 的 Ubuntu2404 Readme）
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run core tests
        run: node src/core/core.test.mjs

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      # 之前用 android-actions/setup-android，v3/v4 都在 setup 阶段直接失败（日志需登录才能看）。
      # 镜像本身已预装 android-34（项目 compileSdk=34）+ build-tools 34.0.0 + platform-tools 且许可已接受，
      # 所以这里只做「确认齐全，缺了才兜底补装」，不再依赖第三方 action。
      - name: Ensure Android SDK 34
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK" ]; then echo "找不到 Android SDK：$SDK"; exit 1; fi
          echo "sdk=$SDK"
          echo "platforms: $(ls "$SDK/platforms" 2>/dev/null | tr '\n' ' ')"
          echo "build-tools: $(ls "$SDK/build-tools" 2>/dev/null | tr '\n' ' ')"
          if [ ! -d "$SDK/platforms/android-34" ] || [ ! -d "$SDK/build-tools/34.0.0" ]; then
            SDKMGR="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n 1)"
            test -n "$SDKMGR" || { echo "sdkmanager 不存在，无法补装 SDK"; exit 1; }
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          fi

      - name: Install npm deps
        run: npm ci --no-audit --no-fund

      - name: Sync web assets into android project
        run: npm run cap:sync

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: wol-waker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to release (apk-latest)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: apk-latest
          name: wol-waker 安卓测试包
          body: |
            自动构建的 debug 安装包，可直接在手机上安装测试。
            每次 main 分支构建都会覆盖更新此 Release。
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
