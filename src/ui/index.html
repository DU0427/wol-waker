<!doctype html>
<html lang="zh-CN" mode="ios">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F5F5F7" />
<title>远程唤醒</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2334C759'/%3E%3Cpath d='M16 7.5v9' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M11.5 10.5a6.5 6.5 0 1 0 9 0' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="./vendor/ionic/ionic.bundle.css" />
<link rel="stylesheet" href="./styles.css" />
<script>
  window.Ionic = { config: { mode: 'ios', rippleEffect: false } };
</script>
<script type="module" src="./vendor/ionic/ionic.esm.js"></script>
<script nomodule src="./vendor/ionic/ionic.js"></script>
<script type="module" src="./vendor/ionicons/ionicons.esm.js"></script>
<script nomodule src="./vendor/ionicons/ionicons.js"></script>
</head>
<body>

<ion-app>
  <!-- 自己的布局容器：不直接给 ion-app 设 flex（:host 样式会打架） -->
  <div class="app">
  <!-- 桌面侧边栏（<900px 隐藏） -->
  <aside class="sidebar">
    <div class="brand">
      <span class="logo"><ion-icon name="power"></ion-icon></span>
      <div class="brand-text">
        <h1>远程唤醒</h1>
        <p>wol-waker</p>
      </div>
    </div>
    <nav class="nav">
      <a class="nav-item" href="#/devices" data-nav="devices"><ion-icon name="laptop-outline"></ion-icon><span>设备</span></a>
      <a class="nav-item" href="#/logs" data-nav="logs"><ion-icon name="terminal-outline"></ion-icon><span>日志</span></a>
      <a class="nav-item" href="#/settings" data-nav="settings"><ion-icon name="settings-outline"></ion-icon><span>设置</span></a>
    </nav>
    <div class="sidebar-foot" id="versionFoot"></div>
  </aside>

  <main class="content">
    <ion-header class="appbar">
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-button id="btnBack" fill="clear" hidden>
            <ion-icon slot="icon-only" name="chevron-back"></ion-icon>
          </ion-button>
        </ion-buttons>
        <ion-title id="pageTitle">设备</ion-title>
        <ion-buttons slot="end" id="topbarActions"></ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content id="view" class="view">
      <div class="view-inner" id="viewInner"></div>
    </ion-content>
  </main>

  <ion-tab-bar class="tabbar">
    <ion-tab-button data-nav="devices" href="#/devices">
      <ion-icon name="laptop-outline"></ion-icon>
      <ion-label>设备</ion-label>
    </ion-tab-button>
    <ion-tab-button data-nav="logs" href="#/logs">
      <ion-icon name="terminal-outline"></ion-icon>
      <ion-label>日志</ion-label>
    </ion-tab-button>
    <ion-tab-button data-nav="settings" href="#/settings">
      <ion-icon name="settings-outline"></ion-icon>
      <ion-label>设置</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
  </div>
</ion-app>

<!-- 设备表单弹窗（iOS 底部弹层） -->
<ion-modal id="formModal" backdrop-dismiss="false">
  <ion-header>
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-button fill="clear" id="btnCancel">取消</ion-button>
      </ion-buttons>
      <ion-title id="formTitle">添加设备</ion-title>
      <ion-buttons slot="end">
        <ion-button fill="solid" id="btnSave">保存</ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
    <ion-list inset class="form-list">
      <ion-item>
        <ion-input id="fName" label="别名" label-placement="floating" placeholder="家里的电脑"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input id="fHost" label="域名 / IP" label-placement="floating" placeholder="xxx.ddns.net"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input id="fPort" label="唤醒端口" label-placement="floating" type="number" value="9"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input id="fCheck" label="检查端口（可选，逗号分隔）" label-placement="floating" placeholder="3389,22"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input id="fMac" label="MAC 地址" label-placement="floating" placeholder="AA:BB:CC:DD:EE:FF"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input id="fSecure" label="SecureOn 密码（可选）" label-placement="floating" placeholder="留空即无密码"></ion-input>
      </ion-item>
    </ion-list>
    <ion-text class="form-error" id="formError" hidden></ion-text>
  </ion-content>
</ion-modal>

<script src="./wol.js"></script>
<script src="./native-android.js"></script>
<script src="./store.js"></script>
<script src="./views.js"></script>
<script src="./app.js"></script>
</body>
</html>
