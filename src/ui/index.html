<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0f16" />
<title>远程唤醒</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3.5v8.5"/><path d="M6.6 7.1a7.5 7.5 0 1 0 10.8 0"/></symbol>
  <symbol id="i-devices" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></symbol>
  <symbol id="i-terminal" viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/><path d="M7.5 10.5 10 13l-2.5 2.5"/><path d="M12.5 15.5H16"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h9"/><path d="M19 7h1"/><circle cx="16" cy="7" r="2.4"/><path d="M4 17h5"/><path d="M15 17h5"/><circle cx="11.5" cy="17" r="2.4"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4Z"/><path d="M14.5 5.5 18.5 9.5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 9.5 12 15.5 18 9.5"/></symbol>
  <symbol id="i-arrow-up-right" viewBox="0 0 24 24"><path d="M14 5h5v5"/><path d="M19 5l-8 8"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></symbol>
</svg>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="logo"><svg class="i"><use href="#i-power"/></svg></span>
      <div class="brand-text">
        <h1>远程唤醒</h1>
        <p>wol-waker</p>
      </div>
    </div>
    <nav class="nav">
      <a class="nav-item" href="#/devices" data-nav="devices"><svg class="i"><use href="#i-devices"/></svg><span>设备</span></a>
      <a class="nav-item" href="#/logs" data-nav="logs"><svg class="i"><use href="#i-terminal"/></svg><span>日志</span></a>
      <a class="nav-item" href="#/settings" data-nav="settings"><svg class="i"><use href="#i-settings"/></svg><span>设置</span></a>
    </nav>
    <div class="sidebar-foot" id="versionFoot">v0.1.0</div>
  </aside>

  <main class="content">
    <header class="topbar">
      <button class="icon-btn" id="btnBack" type="button" hidden aria-label="返回">
        <svg class="i"><use href="#i-back"/></svg>
      </button>
      <h1 id="pageTitle">设备</h1>
      <div class="topbar-actions" id="topbarActions"></div>
    </header>
    <div class="view" id="view"></div>
  </main>

  <nav class="tabbar">
    <a class="tab" href="#/devices" data-nav="devices"><svg class="i"><use href="#i-devices"/></svg><span>设备</span></a>
    <a class="tab" href="#/logs" data-nav="logs"><svg class="i"><use href="#i-terminal"/></svg><span>日志</span></a>
    <a class="tab" href="#/settings" data-nav="settings"><svg class="i"><use href="#i-settings"/></svg><span>设置</span></a>
  </nav>
</div>

<!-- 设备表单（弹窗） -->
<div id="sheet" class="sheet" hidden>
  <div class="backdrop" data-close></div>
  <form id="form" class="sheet-card" autocomplete="off" novalidate>
    <div class="sheet-head">
      <h2 id="formTitle">添加设备</h2>
      <button type="button" class="icon-btn" data-close aria-label="关闭"><svg class="i"><use href="#i-x"/></svg></button>
    </div>

    <div class="sheet-body">
      <label class="field">
        <span class="lbl">别名</span>
        <input id="fName" maxlength="24" placeholder="家里的电脑" />
      </label>

      <label class="field">
        <span class="lbl">域名 / IP</span>
        <input id="fHost" required placeholder="xxx.ddns.net" inputmode="url" spellcheck="false" />
      </label>

      <div class="grid2">
        <label class="field">
          <span class="lbl">唤醒端口</span>
          <input id="fPort" type="number" value="9" min="1" max="65535" required inputmode="numeric" />
          <small>魔术包发往此端口</small>
        </label>
        <label class="field">
          <span class="lbl">检查端口<span class="opt">可选</span></span>
          <input id="fCheck" placeholder="3389,22" inputmode="numeric" spellcheck="false" />
          <small>TCP 能连上即在线</small>
        </label>
      </div>

      <label class="field">
        <span class="lbl">MAC 地址</span>
        <input id="fMac" required maxlength="17" placeholder="AA:BB:CC:DD:EE:FF"
               spellcheck="false" autocapitalize="characters" autocomplete="off" />
        <small>自动大写并补冒号；粘贴 <code>AA-BB-…</code> 或 <code>AABB…</code> 也可识别</small>
      </label>

      <label class="field">
        <span class="lbl">SecureOn 密码<span class="opt">可选</span></span>
        <input id="fSecure" maxlength="17" placeholder="留空即无密码"
               spellcheck="false" autocapitalize="characters" autocomplete="off" />
      </label>

      <p id="formError" class="form-error" hidden></p>
    </div>

    <div class="sheet-foot">
      <button type="button" class="ghost-btn" data-close>取消</button>
      <button type="submit" class="primary-btn">保存</button>
    </div>
  </form>
</div>

<script src="./wol.js"></script>
<script src="./native-android.js"></script>
<script src="./store.js"></script>
<script src="./views.js"></script>
<script src="./app.js"></script>
</body>
</html>
